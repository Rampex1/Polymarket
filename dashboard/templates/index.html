<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polymarket Bot</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    #last-updated { font-size: 0.75rem; color: #8b949e; }

    /* ── Stat cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px 20px;
    }
    .card .label { font-size: 0.72rem; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .card .value { font-size: 1.55rem; font-weight: 700; }
    .card .value.pos { color: #3fb950; }
    .card .value.neg { color: #f85149; }
    .card .value.neu { color: #e6edf3; }

    /* ── Grid layout ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    /* ── Panels ── */
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #8b949e;
      padding: 14px 18px;
      border-bottom: 1px solid #30363d;
    }

    /* ── Tables ── */
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      text-align: left;
      padding: 10px 16px;
      color: #8b949e;
      font-weight: 500;
      font-size: 0.72rem;
      text-transform: uppercase;
      border-bottom: 1px solid #30363d;
    }
    td { padding: 10px 16px; border-bottom: 1px solid #21262d; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2128; }
    .empty { padding: 24px 18px; color: #8b949e; font-size: 0.82rem; }

    /* ── Chart ── */
    .chart-wrap { padding: 16px; height: 240px; position: relative; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-buy    { background: #0d4429; color: #3fb950; }
    .badge-sell   { background: #3d1f1f; color: #f85149; }
    .badge-redeem { background: #1f2d3d; color: #58a6ff; }

    .pos { color: #3fb950; }
    .neg { color: #f85149; }
    .muted { color: #8b949e; }

    .full { grid-column: 1 / -1; }
  </style>
</head>
<body>

<header>
  <h1>Polymarket Copy Bot</h1>
  <span id="last-updated">Loading…</span>
</header>

<!-- Stat cards -->
<div class="cards">
  <div class="card">
    <div class="label">Available Cash</div>
    <div class="value neu" id="c-balance">—</div>
  </div>
  <div class="card">
    <div class="label">Open Exposure</div>
    <div class="value neu" id="c-exposure">—</div>
  </div>
  <div class="card">
    <div class="label">Total Value</div>
    <div class="value neu" id="c-total">—</div>
  </div>
  <div class="card">
    <div class="label">Today P&amp;L</div>
    <div class="value" id="c-today-pnl">—</div>
  </div>
  <div class="card">
    <div class="label">All-time P&amp;L</div>
    <div class="value" id="c-total-pnl">—</div>
  </div>
  <div class="card">
    <div class="label">Trades</div>
    <div class="value neu" id="c-trades">—</div>
  </div>
</div>

<div class="grid">
  <!-- Open positions -->
  <div class="panel">
    <div class="panel-title">Open Positions</div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Outcome</th>
            <th>Market</th>
            <th>Shares</th>
            <th>Avg Price</th>
            <th>Cost</th>
          </tr>
        </thead>
        <tbody id="positions-body">
          <tr><td colspan="5" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- P&L chart -->
  <div class="panel">
    <div class="panel-title">Cumulative P&amp;L</div>
    <div class="chart-wrap">
      <canvas id="pnl-chart"></canvas>
    </div>
  </div>

  <!-- Trade history -->
  <div class="panel full">
    <div class="panel-title">Recent Trades</div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Action</th>
            <th>Outcome</th>
            <th>Market</th>
            <th>Shares</th>
            <th>Price</th>
            <th>Amount</th>
            <th>P&amp;L</th>
          </tr>
        </thead>
        <tbody id="trades-body">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const fmt  = v => '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  const sign = v => (v >= 0 ? '+' : '-') + fmt(v);
  const cls  = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted';

  let chart = null;

  function buildChart(labels, values) {
    const ctx = document.getElementById('pnl-chart').getContext('2d');
    const color = values.at(-1) >= 0 ? '#3fb950' : '#f85149';
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: color,
          backgroundColor: color + '22',
          borderWidth: 2,
          pointRadius: values.length < 15 ? 4 : 0,
          fill: true,
          tension: 0.3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8b949e', maxTicksLimit: 6 }, grid: { color: '#21262d' } },
          y: { ticks: { color: '#8b949e', callback: v => '$'+v }, grid: { color: '#21262d' } },
        }
      }
    });
  }

  function refresh() {
    fetch('/api/data')
      .then(r => r.json())
      .then(d => {
        // Cards
        document.getElementById('c-balance').textContent   = fmt(d.balance);
        document.getElementById('c-exposure').textContent  = fmt(d.exposure);
        document.getElementById('c-total').textContent     = fmt(d.total_value);
        document.getElementById('c-trades').textContent    = `${d.total_buys}B / ${d.total_closes}C`;

        const tp = document.getElementById('c-today-pnl');
        tp.textContent = sign(d.today_pnl);
        tp.className = 'value ' + cls(d.today_pnl);

        const ap = document.getElementById('c-total-pnl');
        ap.textContent = sign(d.total_pnl);
        ap.className = 'value ' + cls(d.total_pnl);

        // Positions
        const pb = document.getElementById('positions-body');
        if (d.positions.length === 0) {
          pb.innerHTML = '<tr><td colspan="5" class="empty">No open positions</td></tr>';
        } else {
          pb.innerHTML = d.positions.map(p => `
            <tr>
              <td>${p.outcome}</td>
              <td class="muted" title="${p.question}">${p.question.substring(0,40)}${p.question.length>40?'…':''}</td>
              <td>${p.shares.toFixed(2)}</td>
              <td>${p.avg_price.toFixed(4)}</td>
              <td>${fmt(p.cost)}</td>
            </tr>`).join('');
        }

        // Trades
        const tb = document.getElementById('trades-body');
        if (d.trades.length === 0) {
          tb.innerHTML = '<tr><td colspan="8" class="empty">No trades yet</td></tr>';
        } else {
          tb.innerHTML = d.trades.map(t => `
            <tr>
              <td class="muted">${t.time}</td>
              <td><span class="badge badge-${t.action.toLowerCase()}">${t.action}</span></td>
              <td>${t.outcome}</td>
              <td title="${t.question}">${t.question.substring(0,38)}${t.question.length>38?'…':''}</td>
              <td>${t.shares.toFixed(2)}</td>
              <td>${t.price.toFixed(4)}</td>
              <td>${fmt(t.amount)}</td>
              <td class="${cls(t.pnl)}">${t.pnl !== 0 ? sign(t.pnl) : '—'}</td>
            </tr>`).join('');
        }

        // Chart
        if (d.daily_pnl.length > 0) {
          buildChart(d.daily_pnl.map(x => x.date), d.daily_pnl.map(x => x.pnl));
        } else {
          buildChart(['Today'], [0]);
        }

        document.getElementById('last-updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      });
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
