# Discord webhook registry — single place to track every webhook in use.
#
# Webhook URLs are write-access secrets (anyone holding one can post to the
# channel). Committed on the explicit call that this repo is PRIVATE —
# if the repo ever goes public, rotate every webhook below first; they
# live in git history forever.
#
# The bot reads webhooks only via DISCORD_WEBHOOK_URL in .env /
# .env.<profile>; this registry is the operator's map of which URL lives
# where. When adding one: add a block here, then point the relevant
# .env.<profile> at it (locally AND on the VPS).

