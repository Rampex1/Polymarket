# Discord webhook registry — copy to config/webhooks.toml (gitignored) and
# fill in real URLs. One block per webhook/channel.
#
# Webhook URLs are write-access secrets: anyone holding one can post to the
# channel. They never go in committed files — the bot reads them only via
# DISCORD_WEBHOOK_URL in .env / .env.<profile>; this registry is the
# operator's map of which URL lives where.

[prod]
url = "https://discord.com/api/webhooks/<id>/<token>"
used_by = [".env"]
notes = "Real-money alerts."

[experimental]
url = "https://discord.com/api/webhooks/<id>/<token>"
used_by = [".env.experimental (local + VPS)"]
notes = "Paper-trading noise channel."
