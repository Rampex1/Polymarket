# Paper algorithms under test. Never sets allow_live, so a live block here
# is rejected at boot. Knob values: algorithms/<type>/params.py.
#
# resolution_carry only, deliberately. insider_flow and both arms of the
# copy_trade sports A/B were removed rather than paused — a block is the only
# thing that makes an algorithm run, so deleting it stops the worker while
# leaving every row it wrote in place, partitioned by `algo`. Restoring any of
# them is re-adding the three lines; the names are the DB partition keys, so
# they must come back spelled exactly as they were:
#
#   insider_flow / insider_flow_paper
#   copy_trade   / copy_trade_paper          (sports excluded — control)
#   copy_trade   / copy_trade_sports_paper   (sports kept — treatment)
#
# Note that their open positions stop being swept while they are out, so
# anything they still hold will not settle and its signals rows will not be
# outcome-labeled until the block returns.

[[algorithm]]
type = "resolution_carry"
name = "resolution_carry_paper"
mode = "paper"
