# Prod profile — REAL MONEY. Loaded with PROFILE=prod (POLY_* creds come
# from the single shared .env; this file holds behavior only — never secrets).
#
# Keep this list short and conservative. Mode must be explicit on every
# block; promote a paper variant by copying its block from
# experimental.toml and flipping mode to "live".

# Real-money opt-in: the loader rejects any mode="live" block in a profile
# that doesn't set this. Only prod should ever set it.
allow_live = true

# Intentionally no [[algorithm]] blocks — prod is paused, no live trading.
# The loader fails fast (ProfileError) if PROFILE=prod is booted in this
# state, by design: a typo or accidental restart can never "succeed" into
# silently running nothing. To resume, add a block back (e.g. copy_trade)
# and run scripts/setup_vm.sh.
