# Default profile — used when PROFILE is unset.
# One env-style copy-trade worker, paper mode. Suitable for development.
#
# Every algorithm block needs: type (registry key), name (DB partition key —
# stable once set; renaming orphans its history), and mode ("paper"/"live").
# Knobs omitted from [algorithm.params] use the schema defaults — run
# `python -m bot.params copy_trade` to see every knob with its default.

[[algorithm]]
type = "copy_trade"
name = "copy_trade"
mode = "paper"

[algorithm.params]
target_address = "0x9f2fe025f84839ca81dd8e0338892605702d2ca8"   # surfandturf
